<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ClipMetric</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #f1f2f6);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
    --text: var(--tg-theme-text-color, #0f1115);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --link: var(--tg-theme-link-color, #2f7cf6);
    --accent: var(--tg-theme-button-color, #2f7cf6);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --line: color-mix(in srgb, var(--hint) 18%, transparent);
    --soft: color-mix(in srgb, var(--hint) 10%, transparent);
    --danger: #ff453a;
    --up: #22b45e;
    --gold1: #ffbf1f; --gold2: #ff7a1a;
    --r: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: env(safe-area-inset-bottom); }
  main { max-width: 540px; margin: 0 auto; padding: 14px 16px 40px; }
  button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; padding: 0; }

  /* шапка */
  .top { display: flex; align-items: center; justify-content: space-between; margin: 2px 2px 14px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: -.2px; }
  .logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    background: linear-gradient(135deg, #5b8cff, #a35bff); }
  .badge { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px;
    background: var(--soft); color: var(--hint); }
  .badge.pro { background: linear-gradient(90deg, var(--gold1), var(--gold2)); color: #fff; }

  /* сводка */
  .hero { background: var(--card); border-radius: var(--r); padding: 16px; margin-bottom: 14px; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .kpi .v { font-size: 22px; font-weight: 700; letter-spacing: -.4px; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 12px; color: var(--hint); }
  .kpi .d { font-size: 12px; color: var(--up); font-weight: 600; }
  .meter { margin-top: 14px; }
  .meter-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--hint); margin-bottom: 6px; }
  .meter-row b { color: var(--text); font-weight: 600; }
  .bar { height: 6px; border-radius: 99px; background: var(--soft); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .4s; }

  /* вкладки */
  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--soft); border-radius: 12px;
    padding: 3px; margin-bottom: 14px; }
  .tabs button { padding: 8px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--hint); }
  .tabs button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .page { display: none; } .page.on { display: block; }

  /* площадки */
  .sec-title { display: flex; align-items: center; gap: 10px; margin: 18px 4px 8px; }
  .sec-title:first-child { margin-top: 0; }
  .pi { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; flex: none; }
  .pi svg { width: 15px; height: 15px; fill: #fff; }
  .p-tiktok .pi { background: #111; }
  .p-instagram .pi { background: linear-gradient(45deg, #f9a12e, #e1306c 55%, #833ab4); }
  .p-youtube .pi { background: #ff0033; }
  .sec-title .t { font-weight: 700; font-size: 15px; }
  .sec-title .c { margin-left: auto; font-size: 13px; color: var(--hint); }
  .group { background: var(--card); border-radius: var(--r); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .row + .row { border-top: 1px solid var(--line); }
  .ava { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none;
    font-weight: 700; color: #fff; font-size: 16px; text-transform: uppercase; }
  .info { min-width: 0; flex: 1; }
  .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { font-size: 13px; color: var(--hint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta .up { color: var(--up); font-weight: 600; }
  .more { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--hint); flex: none; }
  .more:active { background: var(--soft); }
  .add-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%;
    color: var(--accent); font-weight: 600; text-align: left; }
  .row + .add-row, .row + .note { border-top: 1px solid var(--line); }
  .plus { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: color-mix(in srgb, var(--accent) 12%, transparent); font-size: 22px; font-weight: 400; flex: none; }
  .note { padding: 12px 14px; font-size: 13px; color: var(--hint); }
  .note a { color: var(--link); cursor: pointer; font-weight: 600; }
  .foot { text-align: center; color: var(--hint); font-size: 12px; margin-top: 18px; }

  /* тариф */
  .plan-card { background: var(--card); border-radius: var(--r); padding: 18px; margin-bottom: 12px; position: relative; }
  .plan-card.pro { border: 1.5px solid var(--gold1); }
  .plan-card h3 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .price { font-size: 26px; font-weight: 800; margin: 8px 0 2px; letter-spacing: -.5px; }
  .price small { font-size: 14px; font-weight: 500; color: var(--hint); }
  .cur { position: absolute; top: 16px; right: 16px; font-size: 12px; font-weight: 700; color: var(--hint);
    background: var(--soft); padding: 3px 9px; border-radius: 99px; }
  .feat { list-style: none; padding: 0; margin: 12px 0 0; }
  .feat li { display: flex; gap: 10px; padding: 6px 0; font-size: 14px; }
  .feat li::before { content: "✓"; color: var(--up); font-weight: 800; }
  .feat li.off { color: var(--hint); } .feat li.off::before { content: "—"; color: var(--hint); }
  .btn { width: 100%; margin-top: 14px; border-radius: 12px; padding: 13px; font-weight: 700;
    background: var(--accent); color: var(--accent-text); }
  .btn.gold { background: linear-gradient(90deg, var(--gold1), var(--gold2)); color: #fff; }
  .btn:active { opacity: .85; }
  .small { color: var(--hint); font-size: 12px; margin-top: 10px; text-align: center; }
  .ok { color: var(--up); font-weight: 700; text-align: center; margin-top: 10px; }

  /* нижняя шторка */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: var(--card);
    border-radius: 20px 20px 0 0; padding: 10px 18px calc(22px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .25s cubic-bezier(.2,.8,.2,1); max-width: 540px; margin: 0 auto; }
  .sheet.on { transform: none; }
  .grab { width: 38px; height: 5px; border-radius: 99px; background: var(--line); margin: 0 auto 14px; }
  .sheet h4 { margin: 0 0 4px; font-size: 18px; display: flex; align-items: center; gap: 10px; }
  .sheet p { margin: 0 0 14px; color: var(--hint); font-size: 14px; }
  input, textarea { width: 100%; border: 1.5px solid var(--line); background: var(--bg); color: var(--text);
    border-radius: 12px; padding: 12px 14px; font: inherit; outline: none; }
  textarea { min-height: 84px; resize: none; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; word-break: break-all; }
  input:focus, textarea:focus { border-color: var(--accent); }
  .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 6px; }
  details { margin-top: 12px; font-size: 13px; color: var(--hint); }
  summary { color: var(--link); cursor: pointer; font-weight: 600; }
  details ol { padding-left: 18px; margin: 8px 0 0; } details li { margin: 4px 0; } details a { color: var(--link); }
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand">
      <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><rect x="3" y="12" width="4" height="9" rx="1.5"/><rect x="10" y="7" width="4" height="14" rx="1.5"/><rect x="17" y="3" width="4" height="18" rx="1.5"/></svg></div>
      ClipMetric
    </div>
    <span class="badge" id="badge">Free</span>
  </div>

  <section class="hero">
    <div class="kpis">
      <div class="kpi"><div class="v" id="k-acc">0</div><div class="l">аккаунтов</div></div>
      <div class="kpi"><div class="v" id="k-fol">—</div><div class="l">подписчиков</div><div class="d" id="k-fol-d"></div></div>
      <div class="kpi"><div class="v" id="k-views">—</div><div class="l">просмотров</div></div>
    </div>
    <div class="meter" id="meter">
      <div class="meter-row"><span>Проверки ников сегодня</span><span id="m-txt"></span></div>
      <div class="bar"><i id="m-bar" style="width:0"></i></div>
    </div>
  </section>

  <nav class="tabs">
    <button type="button" class="on" data-tab="acc">Аккаунты</button>
    <button type="button" data-tab="plan">Тариф</button>
  </nav>

  <div class="page on" id="page-acc"></div>

  <div class="page" id="page-plan">
    <div class="plan-card" id="free-card">
      <span class="cur" id="free-cur">текущий</span>
      <h3>Free</h3>
      <div class="price">0 <small>⭐</small></div>
      <ul class="feat" id="free-feat"></ul>
    </div>
    <div class="plan-card pro" id="pro-card">
      <span class="cur" id="pro-cur" style="display:none">текущий</span>
      <h3>⭐ Pro</h3>
      <div class="price"><span id="pro-price">300</span> <small>⭐ / 30 дней</small></div>
      <ul class="feat" id="pro-feat"></ul>
      <button class="btn gold" id="pro-btn" type="button" style="display:none">Оформить Pro</button>
      <div class="ok" id="pro-ok" style="display:none">Оплачено! Pro активирован 🎉</div>
      <div class="small" id="pro-small"></div>
    </div>
  </div>

  <div class="foot" id="foot"></div>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div id="sheet-body"></div>
</div>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  const haptic = (t) => { try { tg.HapticFeedback.impactOccurred(t || "light"); } catch (e) {} };
  if (tg) {
    tg.ready(); tg.expand();
    try { tg.setHeaderColor("secondary_bg_color"); tg.setBackgroundColor("secondary_bg_color"); } catch (e) {}
  }

  // Бот передаёт данные в адресе: ?s=<base64url JSON>
  function readState() {
    const s = new URLSearchParams(location.search).get("s");
    if (!s) return {};
    try {
      const b64 = s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4);
      return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0))));
    } catch (e) { return {}; }
  }
  const state = readState();
  const plan = state.plan || { t: "Free", pro: false, acc: 1, chk: 5, left: 5, price: 300,
                               free_acc: 1, free_chk: 5, pro_acc: 10, pro_chk: 50 };

  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  function fmt(n) {
    if (n == null) return "—";
    const a = Math.abs(n);
    if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace(".0", "") + "M";
    if (a >= 1e4) return (n / 1e3).toFixed(a >= 1e5 ? 0 : 1).replace(".0", "") + "K";
    return n.toLocaleString("ru-RU");
  }
  function plural(n, f) {
    const m10 = n % 10, m100 = n % 100;
    return f[m10 === 1 && m100 !== 11 ? 0 : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? 1 : 2];
  }

  const b64u = (s) => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  // Мини-апп на кнопке меню не умеет sendData — действие уходит боту ссылкой t.me/<бот>?start=…
  function startArg(p) {
    if (p.a === "tt") return "tt-" + b64u(p.nick);
    if (p.a === "del") return "del-" + b64u(p.k);
    return p.a;   // yt, ig, pro
  }
  function send(payload) {
    haptic("medium");
    if (tg && state.bot) {
      tg.openTelegramLink("https://t.me/" + state.bot + "?start=" + startArg(payload));
      setTimeout(() => tg.close(), 300);
      return;
    }
    if (tg && tg.sendData && payload.a !== "ig") { tg.sendData(JSON.stringify(payload)); return; }
    alert("Открой это окно кнопкой «Аккаунты» в боте.");
  }
  function confirmThen(text, fn) {
    if (tg && tg.showConfirm) tg.showConfirm(text, ok => ok && fn());
    else if (confirm(text)) fn();
  }

  const ICON = {
    tiktok: '<svg viewBox="0 0 24 24"><path d="M16.6 5.8A4.3 4.3 0 0 1 15.5 3h-3.1v12.4a2.6 2.6 0 1 1-2.6-2.6c.3 0 .5 0 .8.1V9.7a5.7 5.7 0 1 0 4.9 5.7V9.1a7.3 7.3 0 0 0 4.3 1.4V7.4a4.3 4.3 0 0 1-3.2-1.6z"/></svg>',
    instagram: '<svg viewBox="0 0 24 24"><path d="M12 7.3a4.7 4.7 0 1 0 0 9.4 4.7 4.7 0 0 0 0-9.4zm0 7.7a3 3 0 1 1 0-6 3 3 0 0 1 0 6zM17 5.8a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2zM21.9 8c-.1-1.6-.4-3-1.6-4.2S17.6 2.2 16 2.1C14.4 2 9.6 2 8 2.1 6.4 2.2 5 2.5 3.8 3.7S2.2 6.4 2.1 8C2 9.6 2 14.4 2.1 16c.1 1.6.4 3 1.6 4.2s2.6 1.5 4.2 1.6c1.6.1 6.4.1 8 0 1.6-.1 3-.4 4.2-1.6s1.5-2.6 1.6-4.2c.1-1.6.1-6.4 0-8zm-2.1 9.7a3.2 3.2 0 0 1-1.8 1.8c-1.3.5-4.2.4-5.6.4s-4.3.1-5.6-.4a3.2 3.2 0 0 1-1.8-1.8c-.5-1.3-.4-4.2-.4-5.6s-.1-4.3.4-5.6A3.2 3.2 0 0 1 6.4 4.6c1.3-.5 4.2-.4 5.6-.4s4.3-.1 5.6.4a3.2 3.2 0 0 1 1.8 1.8c.5 1.3.4 4.2.4 5.6s.1 4.3-.4 5.6z"/></svg>',
    youtube: '<svg viewBox="0 0 24 24"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12 31 31 0 0 0 1 16.8a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8zM9.7 15V9l5.8 3-5.8 3z"/></svg>',
  };
  const PLATFORMS = [
    { p: "tiktok", title: "TikTok", unit: ["подписчик", "подписчика", "подписчиков"], post: ["пост", "поста", "постов"], color: "#25262b" },
    { p: "instagram", title: "Instagram", unit: ["подписчик", "подписчика", "подписчиков"], post: ["пост", "поста", "постов"], color: "#d6336c" },
    { p: "youtube", title: "YouTube", unit: ["подписчик", "подписчика", "подписчиков"], post: ["ролик", "ролика", "роликов"], color: "#e03131" },
  ];

  // ---- шапка и сводка ----
  $("badge").textContent = plan.t;
  if (plan.pro) $("badge").classList.add("pro");
  let nAcc = 0, fol = 0, folD = 0, views = 0, hasFol = false, hasViews = false, lastTs = null;
  PLATFORMS.forEach(({ p }) => (state[p] || []).forEach(a => {
    nAcc++;
    if (a.f != null) { fol += a.f; hasFol = true; }
    if (a.fd) folD += a.fd;
    if (a.v != null) { views += a.v; hasViews = true; }
    if (a.ts && (!lastTs || a.ts > lastTs)) lastTs = a.ts;
  }));
  $("k-acc").textContent = nAcc;
  $("k-fol").textContent = hasFol ? fmt(fol) : "—";
  if (folD) { $("k-fol-d").textContent = (folD > 0 ? "+" : "−") + fmt(Math.abs(folD)) + " за 24ч"; if (folD < 0) $("k-fol-d").style.color = "var(--danger)"; }
  $("k-views").textContent = hasViews ? fmt(views) : "—";
  if (plan.chk != null) {
    $("m-txt").innerHTML = "<b>" + plan.left + "</b> из " + plan.chk;
    requestAnimationFrame(() => $("m-bar").style.width = Math.max(0, Math.min(100, plan.left / plan.chk * 100)) + "%");
  } else {
    $("m-txt").innerHTML = "<b>без лимита</b>";
    $("m-bar").style.width = "100%";
  }
  if (lastTs) $("foot").textContent = "Данные обновлены " + lastTs;

  // ---- вкладки ----
  function openTab(name) {
    document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
    $("page-acc").classList.toggle("on", name === "acc");
    $("page-plan").classList.toggle("on", name === "plan");
  }
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { haptic(); openTab(b.dataset.tab); });

  // ---- аккаунты ----
  const page = $("page-acc");
  PLATFORMS.forEach(cfg => {
    const items = state[cfg.p] || [];
    const head = el("div", "sec-title p-" + cfg.p);
    const pi = el("div", "pi"); pi.innerHTML = ICON[cfg.p];
    const lim = plan.acc != null ? items.length + " / " + plan.acc : String(items.length || "");
    head.append(pi, el("div", "t", cfg.title), el("div", "c", lim));
    page.appendChild(head);

    const group = el("div", "group");
    items.forEach(a => {
      const row = el("div", "row");
      const name = (a.n || "").replace(/^@/, "");
      const ava = el("div", "ava", name.slice(0, 1) || "?"); ava.style.background = cfg.color;
      const info = el("div", "info");
      info.appendChild(el("div", "nm", a.n));
      const meta = el("div", "meta");
      const bits = [];
      if (a.f != null) bits.push(fmt(a.f) + " " + plural(a.f, cfg.unit));
      if (a.c) bits.push(a.c + " " + plural(a.c, cfg.post));
      if (a.v != null && a.c) bits.push("👁 " + fmt(a.v));
      meta.textContent = bits.length ? bits.join(" · ") : "данные появятся после первого сбора";
      if (a.fd) { const s = el("span", "up", "  " + (a.fd > 0 ? "+" : "−") + fmt(Math.abs(a.fd))); if (a.fd < 0) s.style.color = "var(--danger)"; meta.appendChild(s); }
      info.appendChild(meta);
      const more = el("button", "more"); more.type = "button";
      more.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';
      more.setAttribute("aria-label", "Отключить");
      more.onclick = () => { haptic(); confirmThen("Отключить " + a.n + "? Собранная статистика сохранится.", () => send({ a: "del", k: a.k })); };
      row.append(ava, info, more);
      group.appendChild(row);
    });

    if (cfg.p === "youtube" && state.yt_on === false) {
      group.appendChild(el("div", "note", "Подключение YouTube скоро будет доступно."));
    } else if (plan.acc != null && items.length >= plan.acc) {
      const note = el("div", "note");
      if (plan.pro) note.textContent = "Достигнут лимит тарифа — " + plan.acc + " " + plural(plan.acc, ["аккаунт", "аккаунта", "аккаунтов"]) + ".";
      else {
        note.append("На Free — " + plan.acc + " аккаунт на площадку. ");
        const a = el("a", null, "Больше в Pro ⭐"); a.onclick = () => { haptic(); openTab("plan"); };
        note.appendChild(a);
      }
      group.appendChild(note);
    } else {
      const add = el("button", "add-row"); add.type = "button";
      add.append(el("div", "plus", "+"), el("span", null, cfg.p === "youtube" ? "Подключить канал" : "Подключить аккаунт"));
      add.onclick = () => { haptic(); openSheet(cfg.p); };
      group.appendChild(add);
    }
    page.appendChild(group);
  });

  // ---- шторка подключения ----
  function closeSheet() { $("sheet").classList.remove("on"); $("scrim").classList.remove("on"); document.activeElement && document.activeElement.blur(); }
  $("scrim").onclick = closeSheet;
  if (tg && tg.BackButton) tg.BackButton.onClick(() => { closeSheet(); tg.BackButton.hide(); });

  function sheetHead(p, title, sub) {
    const h = el("h4"); const pi = el("div", "pi"); pi.innerHTML = ICON[p];
    const wrap = el("div", "p-" + p); wrap.style.display = "contents"; wrap.appendChild(pi);
    h.append(wrap, title);
    return [h, el("p", null, sub)];
  }

  function parseNick(text) {
    text = text.trim();
    const m = text.match(/tiktok\.com\/@([A-Za-z0-9_.]{2,24})/);
    if (m) return m[1].toLowerCase();
    const n = text.match(/^@?([A-Za-z0-9_.]{2,24})$/);
    return n ? n[1].toLowerCase() : null;
  }

  function openSheet(p) {
    const body = $("sheet-body"); body.innerHTML = "";
    const err = el("div", "err");
    const btn = el("button", "btn", "Подключить"); btn.type = "button";
    if (p === "tiktok") {
      body.append(...sheetHead(p, "TikTok", "Ник или ссылка на профиль. Пароль не нужен."));
      const inp = el("input"); inp.placeholder = "@nickname"; inp.autocomplete = "off"; inp.autocapitalize = "off"; inp.spellcheck = false;
      btn.onclick = () => {
        const nick = parseNick(inp.value);
        if (!nick) { err.textContent = "Похоже, это не ник TikTok"; haptic("heavy"); return; }
        if ((state.tiktok || []).some(a => a.k === "tiktok:" + nick)) { err.textContent = "Этот аккаунт уже подключён"; return; }
        send({ a: "tt", nick });
      };
      inp.onkeydown = (e) => { if (e.key === "Enter") btn.onclick(); };
      body.append(inp, err, btn);
      setTimeout(() => inp.focus(), 250);
    } else if (p === "instagram") {
      body.append(...sheetHead(p, "Instagram", "Нужен токен доступа профессионального аккаунта. Скопируй его, нажми кнопку и пришли токен боту сообщением — бот сразу удалит его из чата."));
      btn.textContent = "Отправить токен боту";
      btn.onclick = () => send({ a: "ig" });
      const det = el("details");
      det.innerHTML = '<summary>Где взять токен?</summary><ol>' +
        '<li>Аккаунт Instagram — «Профессиональный» (Автор или Бизнес).</li>' +
        '<li>Открой <a href="https://developers.facebook.com/apps" target="_blank">developers.facebook.com/apps</a> → создай приложение с «Instagram API».</li>' +
        '<li>Instagram → «API setup with Instagram login» → добавь аккаунт.</li>' +
        '<li>Нажми «Generate token», скопируй и вставь сюда.</li></ol>';
      body.append(btn, det);
    } else {
      body.append(...sheetHead(p, "YouTube", "Бот пришлёт ссылку и код: открой ссылку, войди в Google-аккаунт с нужным каналом и введи код."));
      btn.textContent = "Войти через Google";
      btn.onclick = () => send({ a: "yt" });
      body.append(btn);
    }
    $("scrim").classList.add("on"); $("sheet").classList.add("on");
    if (tg && tg.BackButton) tg.BackButton.show();
  }

  // ---- тариф ----
  const accW = (n) => n + " " + plural(n, ["аккаунт", "аккаунта", "аккаунтов"]);
  const fFeat = [
    [true, plan.free_chk + " проверок TikTok-ников в день"],
    [true, accW(plan.free_acc) + " на каждую площадку"],
    [true, "тень, похожий контент, графики"],
  ];
  const pFeat = [
    [true, plan.pro_chk + " проверок TikTok-ников в день"],
    [true, "до " + accW(plan.pro_acc) + " на каждую площадку"],
    [true, "тень, похожий контент, графики — по всем аккаунтам"],
  ];
  const fill = (ul, list) => list.forEach(([on, t]) => { const li = el("li", on ? "" : "off", t); $(ul).appendChild(li); });
  fill("free-feat", fFeat); fill("pro-feat", pFeat);
  $("pro-price").textContent = plan.price;
  if (plan.pro) {
    $("free-cur").style.display = "none"; $("pro-cur").style.display = "";
    $("pro-small").textContent = plan.until ? "Активен до " + plan.until + ". Продление и отмена — в настройках Telegram." : "Активен.";
  } else if (state.pay) {
    $("pro-btn").style.display = ""; $("pro-btn").textContent = "Оформить Pro — " + plan.price + " ⭐";
    $("pro-small").textContent = "Подписка продлевается раз в 30 дней. Отменить можно в любой момент в Telegram.";
    $("pro-btn").onclick = () => {
      haptic("medium");
      if (!tg || !tg.openInvoice) { location.href = state.pay; return; }
      tg.openInvoice(state.pay, status => {
        if (status === "paid") {
          try { tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
          $("pro-btn").style.display = "none"; $("pro-ok").style.display = "";
          setTimeout(() => tg.close(), 1600);
        }
      });
    };
  }
  if (location.hash === "#pro") openTab("plan");
</script>
</body>
</html>
